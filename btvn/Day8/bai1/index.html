<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner dự án</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h2>Ha Noi Melody Residences</h2>
        <div class="desc">
          <p>
            Dự án Ha Noi Melody Residences tọa lạc ngay trung tâm Khu đô thị mới
            Linh Đàm.
          </p>
          <p>
            Dự án có quy mô 3.28ha, dự kiến cung ứng ra thị trường 1.857 căn hộ
            cao cấp
          </p>
        </div>
      </div>
      <div class="location">
        <i class="fa-solid fa-location-dot"></i>
        <p>Quận Hoàng Mai, Hà Nội</p>
      </div>
      <div class="price">
        <h3>3.2 TỶ/CĂN</h3>
      </div>
    </div>
  </body>
</html>
