<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-box">
        <!-- Box trái -->
        <div class="login-left">
          <h2 class="logo">
            <span class="jl">JL</span>
            Just Log
          </h2>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis
            veniam velit sequi maiores dicta saepe doloribus temporibus culpa,
            tempore maxime ipsam ea fugiat.
          </p>
          <btn class="btn">Read more</btn>
          <div class="social">
            <a href="#!"><i class="fab fa-facebook-f"></i></a>
            <a href="#!"><i class="fab fa-twitter"></i></a>
            <a href="#!"><i class="fab fa-google-plus-g"></i></a>
            <a href="#!"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </div>
        <!-- Dấu giữa -->
        <div class="arrow">
          <i class="fa-solid fa-angle-right"></i>
        </div>
        <!-- Box phải -->
        <div class="login-right">
          <h2>
            Login to <span class="underline">your</span> <span>account</span>
          </h2>
          <form action="" class="login-form">
            <input
              class="input-form"
              type="email"
              name="email"
              placeholder="Email address"
            />
            <input
              class="input-form"
              type="password"
              name="password"
              placeholder="Password"
            />
            <div class="options">
              <label> <input type="checkbox" />Remember me</label>
              <a href="#!">Forgot password</a>
            </div>
            <button type="submit" class="btn-login">LOGIN</button>
            <p class="register">
              Don't have an account? <a href="#">Register here</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
